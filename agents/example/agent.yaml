# Example agent: answers weather questions with one tool.
# Validated against contracts/agent-definition.schema.json.
name: weather-assistant
version: "0.1.0"
description: Answers questions about the weather in a few Indian cities.
model: gemini-3.8-flash
instructions: |
  You are a concise weather assistant. Use the get_weather tool for any question about
  current weather; never guess a temperature. If the tool has no data for a city, say so.
tools:
  - name: get_weather
    function: tools:get_weather
callbacks: tools:callbacks
max_steps: 6
