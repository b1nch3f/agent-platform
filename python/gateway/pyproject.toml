[project]
name = "ap-gateway"
version = "0.1.0"
description = "Pass-through model and tool gateway"
requires-python = ">=3.12"
dependencies = ["ap-contracts", "anthropic>=0.40", "opentelemetry-api>=1.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_gateway"]

[tool.uv.sources]
ap-contracts = { workspace = true }
ap-gateway = { workspace = true }
ap-sdk = { workspace = true }
