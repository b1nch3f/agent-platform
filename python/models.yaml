# Model registry: which provider serves each model name.
# An agent definition names one of these in its `model:` field; only the gateway knows the provider.
# `model:` here is the provider's own id for it, when it differs from the registered name.
# Keys come from .env: ANTHROPIC_API_KEY, GEMINI_API_KEY.
models:
  claude-haiku-5-5: { provider: anthropic }
  claude-sonnet-5-5: { provider: anthropic }
  claude-opus-5-5: { provider: anthropic }
  gemini-3.8-flash: { provider: gemini }
  gemini-3.5-flash-lite: { provider: gemini }
