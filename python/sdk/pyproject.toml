[project]
name = "ap-sdk"
version = "0.1.0"
description = "Agent SDK: agent loop, tools, callbacks, conversation store"
requires-python = ">=3.12"
dependencies = ["ap-contracts", "ap-gateway", "opentelemetry-api>=1.27", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_sdk"]

[tool.uv.sources]
ap-contracts = { workspace = true }
ap-gateway = { workspace = true }
ap-sdk = { workspace = true }
