[project]
name = "ap-contracts"
version = "0.1.0"
description = "Pydantic models generated from the JSON Schema in /contracts"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_contracts"]
