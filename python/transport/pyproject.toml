[project]
name = "ap-transport"
version = "0.1.0"
description = "HTTP + SSE transport and the agent-platform CLI"
requires-python = ">=3.12"
dependencies = ["ap-contracts", "ap-sdk", "fastapi>=0.115", "uvicorn>=0.30", "httpx>=0.27", "opentelemetry-api>=1.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_transport"]

[tool.uv.sources]
ap-contracts = { workspace = true }
ap-gateway = { workspace = true }
ap-sdk = { workspace = true }

[project.scripts]
agent-platform = "ap_transport.cli:main"
